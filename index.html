<!DOCTYPE html>
<html>
<head>
  <title>Dodge Master</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b12;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-bottom: 5px;
    }

    #info {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin: 10px;
      font-size: 18px;
    }

    canvas {
      background: #171722;
      border: 3px solid white;
      border-radius: 10px;
      max-width: 95%;
    }

    button {
      margin: 6px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    #startBtn {
      background: #22c55e;
      color: white;
    }

    #pauseBtn {
      background: #eab308;
      color: black;
    }

    #restartBtn {
      background: #ef4444;
      color: white;
    }

    #shop {
      margin: 15px auto;
      padding: 15px;
      max-width: 400px;
      background: #181824;
      border: 2px solid #333;
      border-radius: 12px;
    }

    #shop button {
      background: #3b82f6;
      color: white;
    }

    #message {
      min-height: 25px;
      color: #facc15;
    }
  </style>
</head>

<body>

  <h1>🎮 DODGE MASTER</h1>

  <div id="info">
    <div>⭐ Score: <span id="score">0</span></div>
    <div>💰 Coins: <span id="coins">0</span></div>
    <div>❤️ Lives: <span id="lives">3</span></div>
  </div>

  <canvas id="game" width="450" height="550"></canvas>

  <br>

  <button id="startBtn" onclick="startGame()">
    ▶ START
  </button>

  <button id="pauseBtn" onclick="pauseGame()">
    ⏸ PAUSE
  </button>

  <button id="restartBtn" onclick="startGame()">
    🔄 RESTART
  </button>

  <p id="message"></p>

  <div id="shop">

    <h2>🛒 SHOP</h2>

    <p>⚡ Speed Upgrade — 50 coins</p>
    <button onclick="buySpeed()">
      BUY SPEED
    </button>

    <p>❤️ Extra Life — 100 coins</p>
    <button onclick="buyLife()">
      BUY LIFE
    </button>

  </div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player;
let enemies;

let score = 0;
let coins = 0;
let lives = 3;

let gameRunning = false;
let paused = false;

let enemySpeed = 3;
let spawnRate = 0.025;

let playerSpeed = 6;

let highScore =
  Number(localStorage.getItem("highScore")) || 0;


/* =========================
   PLAYER
========================= */

function createPlayer() {

  player = {
    x: canvas.width / 2 - 20,
    y: canvas.height - 70,

    width: 40,
    height: 40,

    speed: playerSpeed
  };

}


/* =========================
   START GAME
========================= */

function startGame() {

  createPlayer();

  enemies = [];

  score = 0;
  lives = 3;

  enemySpeed = 3;
  spawnRate = 0.025;

  gameRunning = true;
  paused = false;

  document.getElementById("score").textContent = score;
  document.getElementById("lives").textContent = lives;

  document.getElementById("message").textContent =
    "Survive as long as you can!";

  gameLoop();
}


/* =========================
   KEYBOARD
========================= */

let keys = {};

document.addEventListener("keydown", function(event) {

  keys[event.key] = true;

});


document.addEventListener("keyup", function(event) {

  keys[event.key] = false;

});


/* =========================
   MOVE PLAYER
========================= */

function movePlayer() {

  if (keys["ArrowLeft"] || keys["a"]) {

    player.x -= player.speed;

  }

  if (keys["ArrowRight"] || keys["d"]) {

    player.x += player.speed;

  }


  // Keep player inside screen

  if (player.x < 0) {

    player.x = 0;

  }

  if (player.x + player.width > canvas.width) {

    player.x =
      canvas.width - player.width;

  }

}


/* =========================
   CREATE ENEMY
========================= */

function createEnemy() {

  const size =
    Math.floor(Math.random() * 25) + 25;

  enemies.push({

    x: Math.random() *
      (canvas.width - size),

    y: -size,

    width: size,

    height: size,

    speed:
      enemySpeed +
      Math.random() * 2

  });

}


/* =========================
   DRAW PLAYER
========================= */

function drawPlayer() {

  ctx.fillStyle = "#22c55e";

  ctx.fillRect(
    player.x,
    player.y,
    player.width,
    player.height
  );


  // Player eyes

  ctx.fillStyle = "black";

  ctx.fillRect(
    player.x + 8,
    player.y + 10,
    6,
    6
  );

  ctx.fillRect(
    player.x + 26,
    player.y + 10,
    6,
    6
  );

}


/* =========================
   DRAW ENEMIES
========================= */

function drawEnemies() {

  for (let enemy of enemies) {

    ctx.fillStyle = "#ef4444";

    ctx.fillRect(
      enemy.x,
      enemy.y,
      enemy.width,
      enemy.height
    );

  }

}


/* =========================
   MOVE ENEMIES
========================= */

function moveEnemies() {

  for (let i = enemies.length - 1; i >= 0; i--) {

    let enemy = enemies[i];

    enemy.y += enemy.speed;


    // Enemy escaped

    if (enemy.y > canvas.height) {

      enemies.splice(i, 1);

      score++;

      coins++;

      document.getElementById("score")
        .textContent = score;

      document.getElementById("coins")
        .textContent = coins;


      // Increase difficulty

      if (score % 10 === 0) {

        enemySpeed += 0.5;

        spawnRate += 0.005;

        document.getElementById("message")
          .textContent =
          "🔥 LEVEL UP! Enemies are faster!";

      }

    }

  }

}


/* =========================
   COLLISION
========================= */

function checkCollision() {

  for (let i = enemies.length - 1; i >= 0; i--) {

    let enemy = enemies[i];


    if (

      player.x <
      enemy.x + enemy.width &&

      player.x + player.width >
      enemy.x &&

      player.y <
      enemy.y + enemy.height &&

      player.y + player.height >
      enemy.y

    ) {

      enemies.splice(i, 1);

      lives--;

      document.getElementById("lives")
        .textContent = lives;


      document.getElementById("message")
        .textContent =
        "💥 You got hit!";


      if (lives <= 0) {

        gameOver();

      }

    }

  }

}


/* =========================
   SPAWN ENEMIES
========================= */

function spawnEnemies() {

  if (Math.random() < spawnRate) {

    createEnemy();

  }

}


/* =========================
   BACKGROUND
========================= */

function drawBackground() {

  ctx.fillStyle = "#171722";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  // Small stars

  ctx.fillStyle = "#333344";

  for (let i = 0; i < 30; i++) {

    let x =
      (i * 73) % canvas.width;

    let y =
      (i * 127) % canvas.height;

    ctx.fillRect(
      x,
      y,
      2,
      2
    );

  }

}


/* =========================
   PAUSE
========================= */

function pauseGame() {

  if (!gameRunning) return;

  paused = !paused;


  if (paused) {

    document.getElementById("message")
      .textContent =
      "⏸ GAME PAUSED";

  } else {

    document.getElementById("message")
      .textContent =
      "▶ GAME RESUMED";

    gameLoop();

  }

}


/* =========================
   GAME OVER
========================= */

function gameOver() {

  gameRunning = false;

  paused = false;


  if (score > highScore) {

    highScore = score;

    localStorage.setItem(
      "highScore",
      highScore
    );

  }


  ctx.fillStyle =
    "rgba(0,0,0,0.7)";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.fillStyle = "white";

  ctx.font = "45px Arial";

  ctx.fillText(
    "GAME OVER",
    95,
    240
  );


  ctx.font = "25px Arial";

  ctx.fillText(
    "Score: " + score,
    170,
    290
  );


  ctx.font = "20px Arial";

  ctx.fillText(
    "Best: " + highScore,
    180,
    325
  );


  document.getElementById("message")
    .textContent =
    "💀 Game Over! Press RESTART.";
}


/* =========================
   SHOP: SPEED
========================= */

function buySpeed() {

  if (coins >= 50) {

    coins -= 50;

    playerSpeed += 2;

    if (player) {

      player.speed =
        playerSpeed;

    }


    document.getElementById("coins")
      .textContent = coins;


    document.getElementById("message")
      .textContent =
      "⚡ Speed upgraded!";

  } else {

    document.getElementById("message")
      .textContent =
      "❌ You need 50 coins!";

  }

}


/* =========================
   SHOP: EXTRA LIFE
========================= */

function buyLife() {

  if (coins >= 100) {

    coins -= 100;

    lives++;

    document.getElementById("coins")
      .textContent = coins;

    document.getElementById("lives")
      .textContent = lives;


    document.getElementById("message")
      .textContent =
      "❤️ Extra life purchased!";

  } else {

    document.getElementById("message")
      .textContent =
      "❌ You need 100 coins!";

  }

}


/* =========================
   MAIN GAME LOOP
========================= */

function gameLoop() {

  if (!gameRunning) return;

  if (paused) return;


  drawBackground();

  movePlayer();

  spawnEnemies();

  moveEnemies();

  checkCollision();

  drawPlayer();

  drawEnemies();


  requestAnimationFrame(gameLoop);

}


/* =========================
   INITIAL SCREEN
========================= */

createPlayer();

drawBackground();

drawPlayer();

</script>

</body>
</html>
