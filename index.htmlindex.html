
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Game</title>
  <style>
    body {
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 10px;
    }
    button {
      padding: 15px 25px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #22c55e;
      color: white;
    }
  </style>
</head>
<body>
  <h1>🎮 My First Game</h1>
  <p>Welcome to my game!</p>
  <h2>Score: <span id="score">0</span></h2>
  <button onclick="addPoint()">Click Me!</button>

  <script>
    let score = 0;

    function addPoint() {
      score++;
      document.getElementById("score").textContent = score;
    }
  </script>
</body>
</html>
