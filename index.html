<!DOCTYPE html>
<html>
<head>
  <title>My First Game</title>
  <style>
    body {
      background: #111827;
      color: white;
      font-family: Arial;
      text-align: center;
      padding: 30px;
    }

    .shop {
      max-width: 400px;
      margin: auto;
      background: #1f2937;
      padding: 20px;
      border-radius: 15px;
    }

    .item {
      background: #374151;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h1>🎮 My First Game</h1>

  <h2>🪙 Coins: <span id="coins">100</span></h2>

  <div class="shop">
    <h2>🛒 SHOP</h2>

    <div class="item">
      ⚡ Speed Boost
      <p>50 coins</p>
      <button onclick="buyItem(50, 'Speed Boost')">BUY</button>
    </div>

    <div class="item">
      ❤️ Extra Life
      <p>100 coins</p>
      <button onclick="buyItem(100, 'Extra Life')">BUY</button>
    </div>
  </div>

  <p id="message"></p>

  <script>
    let coins = 100;

    function buyItem(price, item) {
      if (coins >= price) {
        coins -= price;
        document.getElementById("coins").textContent = coins;
        document.getElementById("message").textContent =
          "✅ You bought " + item + "!";
      } else {
        document.getElementById("message").textContent =
          "❌ Not enough coins!";
      }
    }
  </script>

</body>
</html>
