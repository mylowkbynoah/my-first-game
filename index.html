<!DOCTYPE html>
<html>
<head>
  <title>Dodge Master</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    h1 {
      margin-bottom: 5px;
    }

    #info {
      font-size: 20px;
      margin: 10px;
    }

    canvas {
      background: #222;
      border: 3px solid white;
      border-radius: 10px;
    }

    button {
      padding: 10px 18px;
      margin: 6px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #start {
      background: limegreen;
      color: white;
    }

    #pause {
      background: gold;
    }

    #restart {
      background: red;
      color: white;
    }

    #shop {
      margin: 15px auto;
      padding: 15px;
      width: 350px;
      background: #1c1c28;
      border-radius: 12px;
    }

    #shop button {
      background: #3485ff;
      color: white;
    }

    #message {
      color: yellow;
      min-height: 25px;
    }
  </style>
</head>

<body>

<h1>🎮 DODGE MASTER</h1>

<div id="info">
  ⭐ Score: <span id="score">0</span>
  &nbsp;&nbsp;
  💰 Coins: <span id="coins">0</span>
  &nbsp;&nbsp;
  ❤️ Lives: <span id="lives">3</span>
</div>

<canvas id="game" width="450" height="550"></canvas>

<br>

<button id="start" onclick="startGame()">▶ START</button>
<button id="pause" onclick="pauseGame()">⏸ PAUSE</button>
<button id="restart" onclick="startGame()">🔄 RESTART</button>

<p id="message">Avoid the red blocks!</p>

<div id="shop">

  <h2>🛒 SHOP</h2>

  <p>⚡ Speed Upgrade — 50 coins</p>
  <button onclick="buySpeed()">BUY SPEED</button>

  <p>❤️ Extra Life — 100 coins</p>
  <button onclick="buyLife()">BUY LIFE</button>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player;
let enemies = [];

let score = 0;
let coins = 0;
let lives = 3;

let running = false;
let paused = false;

let playerSpeed = 6;
let enemySpeed = 3;
let spawnRate = 0.025;

let highScore =
  Number(localStorage.getItem("highScore")) || 0;

let keys = {};


/* PLAYER */

function createPlayer() {

  player = {
    x: canvas.width / 2 - 20,
    y: canvas.height - 70,
    width: 40,
    height: 40,
    speed: playerSpeed
  };

}


/* START */

function startGame() {

  createPlayer();

  enemies = [];

  score = 0;
  lives = 3;

  enemySpeed = 3;
  spawnRate = 0.025;

  running = true;
  paused = false;

  updateInfo();

  document.getElementById("message").textContent =
    "🔥 Survive as long as you can!";

  gameLoop();

}


/* KEYBOARD */

document.addEventListener("keydown", function(e) {

  keys[e.key] = true;

});

document.addEventListener("keyup", function(e) {

  keys[e.key] = false;

});


/* MOVE PLAYER */

function movePlayer() {

  if (keys["ArrowLeft"] || keys["a"]) {
    player.x -= player.speed;
  }

  if (keys["ArrowRight"] || keys["d"]) {
    player.x += player.speed;
  }

  if (player.x < 0) {
    player.x = 0;
  }

  if (player.x + player.width > canvas.width) {
    player.x = canvas.width - player.width;
  }

}


/* CREATE ENEMY */

function createEnemy() {

  let size =
    Math.floor(Math.random() * 25) + 25;

  enemies.push({

    x: Math.random() * (canvas.width - size),

    y: -size,

    width: size,

    height: size,

    speed: enemySpeed + Math.random() * 2

  });

}


/* DRAW PLAYER */

function drawPlayer() {

  ctx.fillStyle = "lime";

  ctx.fillRect(
    player.x,
    player.y,
    player.width,
    player.height
  );

  ctx.fillStyle = "black";

  ctx.fillRect(
    player.x + 8,
    player.y + 10,
    6,
    6
  );

  ctx.fillRect(
    player.x + 26,
    player.y + 10,
    6,
    6
  );

}


/* DRAW ENEMIES */

function drawEnemies() {

  ctx.fillStyle = "red";

  for (let enemy of enemies) {

    ctx.fillRect(
      enemy.x,
      enemy.y,
      enemy.width,
      enemy.height
    );

  }

}


/* MOVE ENEMIES */

function moveEnemies() {

  for (let i = enemies.length - 1; i >= 0; i--) {

    let enemy = enemies[i];

    enemy.y += enemy.speed;

    if (enemy.y > canvas.height) {

      enemies.splice(i, 1);

      score++;
      coins++;

      updateInfo();

      if (score % 10 === 0) {

        enemySpeed += 0.5;
        spawnRate += 0.005;

        document.getElementById("message").textContent =
          "🔥 HARDER! The enemies are faster!";

      }

    }

  }

}


/* COLLISION */

function checkCollision() {

  for (let i = enemies.length - 1; i >= 0; i--) {

    let enemy = enemies[i];

    if (

      player.x < enemy.x + enemy.width &&
      player.x + player.width > enemy.x &&
      player.y < enemy.y + enemy.height &&
      player.y + player.height > enemy.y

    ) {

      enemies.splice(i, 1);

      lives--;

      updateInfo();

      document.getElementById("message").textContent =
        "💥 Ouch! You got hit!";

      if (lives <= 0) {

        gameOver();

      }

    }

  }

}


/* SPAWN */

function spawnEnemies() {

  if (Math.random() < spawnRate) {

    createEnemy();

  }

}


/* PAUSE */

function pauseGame() {

  if (!running) return;

  paused = !paused;

  if (paused) {

    document.getElementById("message").textContent =
      "⏸ PAUSED";

  } else {

    document.getElementById("message").textContent =
      "▶ RESUMED";

    gameLoop();

  }

}


/* GAME OVER */

function gameOver() {

  running = false;

  if (score > highScore) {

    highScore = score;

    localStorage.setItem(
      "highScore",
      highScore
    );

  }

  ctx.fillStyle = "rgba(0,0,0,0.75)";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.fillStyle = "white";

  ctx.font = "45px Arial";

  ctx.fillText(
    "GAME OVER",
    95,
    240
  );

  ctx.font = "25px Arial";

  ctx.fillText(
    "Score: " + score,
    170,
    290
  );

  ctx.font = "20px Arial";

  ctx.fillText(
    "Best: " + highScore,
    180,
    325
  );

  document.getElementById("message").textContent =
    "💀 Game Over! Press RESTART.";

}


/* SHOP: SPEED */

function buySpeed() {

  if (coins >= 50) {

    coins -= 50;

    playerSpeed += 2;

    if (player) {
      player.speed = playerSpeed;
    }

    updateInfo();

    document.getElementById("message").textContent =
      "⚡ SPEED UPGRADED!";

  } else {

    document.getElementById("message").textContent =
      "❌ You need 50 coins!";

  }

}


/* SHOP: LIFE */

function buyLife() {

  if (coins >= 100) {

    coins -= 100;

    lives++;

    updateInfo();

    document.getElementById("message").textContent =
      "❤️ EXTRA LIFE!";

  } else {

    document.getElementById("message").textContent =
      "❌ You need 100 coins!";

  }

}


/* UPDATE TEXT */

function updateInfo() {

  document.getElementById("score").textContent =
    score;

  document.getElementById("coins").textContent =
    coins;

  document.getElementById("lives").textContent =
    lives;

}


/* GAME LOOP */

function gameLoop() {

  if (!running || paused) return;

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  movePlayer();

  spawnEnemies();

  moveEnemies();

  checkCollision();

  drawPlayer();

  drawEnemies();

  requestAnimationFrame(gameLoop);

}


/* INITIAL SCREEN */

createPlayer();

ctx.fillStyle = "#222";

ctx.fillRect(
  0,
  0,
  canvas.width,
  canvas.height
);

drawPlayer();

</script>

</body>
</html>
